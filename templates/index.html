<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple School Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #495057;
            word-break: break-all;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Primary Math Calculator</h2>
    <form method="POST">
        <div class="input-group">
            <label for="num1">First Number (or Number for Square Root):</label>
            <input type="number" step="any" id="num1" name="num1" required>
        </div>

        <div class="input-group">
            <label for="operation">Choose Action:</label>
            <select id="operation" name="operation" onchange="toggleSecondInput()">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (−)</option>
                <option value="multiply">Multiplication (×</option>
                <option value="divide">Division (÷)</option>
                <option value="power">Power / Exponent (^)</option>
                <option value="sqrt">Square Root (√)</option>
            </select>
        </div>

        <div class="input-group" id="second-number-group">
            <label for="num2">Second Number:</label>
            <input type="number" step="any" id="num2" name="num2">
        </div>

        <button type="submit">Calculate</button>
    </form>

    {% if result != "" %}
        <div class="output">Result: {{ result }}</div>
    {% endif %}

    {% if error %}
        <div class="output error">{{ error }}</div>
    {% endif %}
</div>

<script>
    function toggleSecondInput() {
        const operation = document.getElementById('operation').value;
        const secondInputGroup = document.getElementById('second-number-group');
        const num2Input = document.getElementById('num2');
        
        if (operation === 'sqrt') {
            secondInputGroup.style.display = 'none';
            num2Input.removeAttribute('required');
        } else {
            secondInputGroup.style.display = 'block';
            num2Input.setAttribute('required', 'required');
        }
    }
    // Initialize verification layout rules on load
    window.onload = toggleSecondInput;
</script>

</body>
</html>
